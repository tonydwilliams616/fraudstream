# -----------------------------------------------------------------------------
# pyproject.toml - the Python project definition for fraudstream.
#
# What: names the package (fraudstream), the Python version it needs, the
#       libraries it depends on, and settings for the test runner (pytest) and
#       the linter (ruff).
# Why:  one file describes how to install the project, so your Mac, CI and the
#       containers all install from the same definition:
#         your Mac   pip install -e ".[dev,train,stream]"
#         CI         pip install -e ".[dev,train]"
#         app images pip install ".[stream]" (no training libraries)
# Concept: "src layout" - the code lives in src/fraudstream/, so tests always run
#       against the installed package, never against stray files that happen to
#       sit in the current folder.
# -----------------------------------------------------------------------------
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudstream"
version = "0.1.0"
description = "Real-time card-fraud scoring: synthetic data, features, training and serving code"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",   # fast maths on large arrays of numbers
  "pandas>=2.2",  # tables of data (one row per transaction)
  "pyarrow>=16",  # reads and writes Parquet, the compact file format for datasets
]

[project.optional-dependencies]
# Training and evaluation (fraudstream.training). Kept out of the core so the app
# images don't carry ~200 MB of libraries they never use.
train = [
  # The model: gradient-boosted decision trees. Pinned to the release line served by
  # SageMaker's built-in XGBoost container (image 3.0-5), so the endpoint loads a model
  # saved by the same XGBoost that trained it (training-serving parity).
  "xgboost>=3.0,<3.1",
  "scikit-learn>=1.5",  # standard evaluation metrics (PR-AUC, ROC-AUC)
]
dev = [
  "pytest>=8",  # runs the tests in tests/
  "ruff>=0.6",  # checks code style and common mistakes
  "boto3>=1.35",  # AWS SDK: uploads dataset versions to S3 (needs 1.35+ for conditional writes)
]
# What the streaming apps (simulator, consumer) need on top of the core package.
# Installed in their container images; tests don't need it.
stream = [
  "confluent-kafka>=2.6",  # Kafka client (librdkafka): producer, consumer, admin
  "aws-msk-iam-sasl-signer-python>=1.0",  # signs MSK IAM tokens with the task's role
  "boto3>=1.35",  # downloads the dataset's reference tables from S3
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
