# -----------------------------------------------------------------------------
# images.yml - builds, smoke-tests and publishes the app container images.
#
# What: for each app (simulator now; consumer later):
#         1. build the image for ARM64 on a native ARM runner
#         2. smoke-test it: run it in DRY_RUN mode against a tiny generated
#            dataset and check it prints the expected messages - no AWS needed
#         3. on main only: push it to ECR as fs/<app>:<commit SHA>
# Why: a pull request proves the image builds and starts; only reviewed code on
#       main is published. Tags are the full commit SHA and the repositories
#       are immutable, so an image tag can never be overwritten - "which code is
#       running?" always has exactly one answer. 35-apps deploys the most
#       recently pushed image.
# Auth: pushes use the fs-github-ecr-push role, which trusts only pushes to
#       main and can only push to fs/* repositories (terraform/bootstrap).
# -----------------------------------------------------------------------------
name: Container images

on:
  pull_request:
    paths:
      - "src/**"
      - "pyproject.toml"
      - "docker/**"
      - ".dockerignore"
      - ".github/workflows/images.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "docker/**"
      - ".dockerignore"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: image (${{ matrix.app }})
    runs-on: ubuntu-24.04-arm # native ARM64 build for Fargate on Graviton
    permissions:
      contents: read
      id-token: write # to assume the ECR push role on main
    strategy:
      fail-fast: false
      matrix:
        app: [simulator]
    env:
      IMAGE: fs-${{ matrix.app }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build --file docker/${{ matrix.app }}.Dockerfile --tag "$IMAGE" .

      - name: Show image size
        run: docker image ls "$IMAGE"

      # Generates a tiny dataset inside the container, then runs the simulator
      # against it in DRY_RUN mode. Proves the image's Python, package and
      # entrypoint all work - without Kafka or AWS.
      - name: Smoke test
        if: matrix.app == 'simulator'
        run: |
          output=$(docker run --rm \
            -e DRY_RUN=1 -e MAX_MESSAGES=5 -e RATE=100 \
            -e DATASET_URI=/tmp/smoke/transactions/v1 \
            --entrypoint sh "$IMAGE" -c '
              python -c "
          from fraudstream.generator.dataset import DatasetParams, generate_dataset
          from fraudstream.storage import save_version
          save_version(generate_dataset(DatasetParams(seed=1, n_cards=300, n_merchants=150, days=3)), \"/tmp/smoke\", \"v1\")
          " && exec python -m fraudstream.simulator')
          echo "$output"
          count=$(echo "$output" | grep -c '"schema_version"')
          if [ "$count" -ne 5 ]; then
            echo "::error::expected 5 messages, got $count"
            exit 1
          fi

      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          role-session-name: gha-ecr-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Push to ECR
        if: github.event_name != 'pull_request'
        run: |
          registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          target="$registry/fs/${{ matrix.app }}:${{ github.sha }}"
          docker tag "$IMAGE" "$target"
          docker push "$target"
          echo "Pushed \`$target\`" >> "$GITHUB_STEP_SUMMARY"
